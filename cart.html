<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Your Cart | Florlaine</title>
<link rel="icon" href="imges/head.svg" type="image/svg+xml" />
<link rel="stylesheet" href="theme.css" />
<script src="theme.js" defer></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap');
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--text);font-family:'DM Sans',sans-serif}
.top-bar{display:flex;align-items:center;gap:1.5rem;padding:1.6rem clamp(2rem,6vw,6rem);background:var(--header-bg);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.top-bar .logo{font-family:'Playfair Display',serif;font-size:2.2rem;font-weight:700;color:var(--text)}
.top-bar .logo span{color:var(--pink)}
.wrap{max-width:1100px;margin:auto;padding:45px 20px 70px}
.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:35px}
.back{color:var(--pink-dark);font-weight:700}
.title{font:700 44px 'Playfair Display',serif;margin:0;color:var(--text)}
#cart-container{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
.cart-item{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:15px;box-shadow:0 12px 35px rgba(70,35,49,.07)}
.cart-item img{width:100%;height:200px;object-fit:contain;background:var(--pink-soft);border-radius:14px}
.cart-item-info{padding:10px 3px}
.cart-item-info h3{font-size:18px;margin:4px 0}
.price{color:var(--pink-dark);font-weight:700}
.quantity-controls{display:flex;align-items:center;justify-content:center;gap:12px;margin:12px 0}
.quantity-controls button,.remove-btn,#checkout-btn{border:0;cursor:pointer;border-radius:999px}
.quantity-controls button{width:34px;height:34px;background:var(--pink-soft);color:var(--pink-dark);font-weight:700}
.remove-btn{padding:9px 14px;background:var(--pink-soft);color:var(--muted)}
.summary{margin-top:30px;padding:24px;background:var(--footer-bg);color:var(--footer-text);border-radius:20px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.total{font-size:21px;font-weight:700}
#checkout-btn{padding:13px 22px;background:var(--pink);color:#2b2527;font-weight:700}
#checkout-btn:disabled{opacity:.45;cursor:not-allowed}
.empty{text-align:center;padding:70px 20px;background:var(--surface);border-radius:20px;border:1px dashed var(--border);color:var(--muted)}
@media(max-width:600px){.top,.summary{align-items:flex-start;flex-direction:column}.title{font-size:36px}}
</style>
</head>
<body>
<header class="top-bar">
  <a href="index.html" class="logo">Florlaine<span>.</span></a>
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle night mode" aria-pressed="false" style="margin-left:auto;">
    <span class="stitch"></span>
  </button>
</header>
<main class="wrap">
<div class="top"><a class="back" href="index.html">← Continue shopping</a><h1 class="title">Your Cart</h1></div>
<div id="cart-container"></div>
<div class="summary"><div class="total" id="total-price">Total: $0.00</div><button id="checkout-btn" onclick="checkout()">Proceed to Checkout</button></div>
</main>
<script>
const cart=JSON.parse(localStorage.getItem('cart')||'[]');
const container=document.getElementById('cart-container'),totalEl=document.getElementById('total-price'),checkoutBtn=document.getElementById('checkout-btn');
function save(){
  localStorage.setItem('cart',JSON.stringify(cart));
  if (window.florlaineUpdateCartCount) window.florlaineUpdateCartCount();
}
function render(){
container.innerHTML='';let total=0;
if(!cart.length){container.innerHTML='<div class="empty">Your cart is empty.<br><br><a class="back" href="index.html#products">Discover our flowers →</a></div>';checkoutBtn.disabled=true;checkoutBtn.textContent='Cart is empty';totalEl.textContent='Total: $0.00';return}
cart.forEach((item,i)=>{const qty=Number(item.quantity)||1,price=Number(item.price)||0;total+=qty*price;
const el=document.createElement('article');el.className='cart-item';el.innerHTML=`<img src="${item.image}" alt="${item.name}"><div class="cart-item-info"><h3>${item.name}</h3><div class="price">$${price.toFixed(2)}</div><div class="quantity-controls"><button aria-label="Decrease quantity" onclick="changeQuantity(${i},-1)">−</button><span>${qty}</span><button aria-label="Increase quantity" onclick="changeQuantity(${i},1)">+</button></div><button class="remove-btn" onclick="removeItem(${i})">Remove</button></div>`;container.appendChild(el)});
totalEl.textContent=`Total: $${total.toFixed(2)}`;checkoutBtn.disabled=false;checkoutBtn.textContent='Proceed to Checkout'
}
function removeItem(i){cart.splice(i,1);save();render()}
function changeQuantity(i,a){cart[i].quantity=(Number(cart[i].quantity)||1)+a;if(cart[i].quantity<1)cart[i].quantity=1;save();render()}
function checkout(){if(cart.length)location.href='checkout.html'}
render();
</script>
<script>
if (window.florlaineUpdateCartCount) window.florlaineUpdateCartCount();
</script>
</body></html>
