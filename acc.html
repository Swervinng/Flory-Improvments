<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Randoms | Florlaine</title>
  <link rel="icon" href="imges/head.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="products.css" />
  <link rel="stylesheet" href="theme.css" />
  <script src="theme.js" defer></script>
</head>
<body>

  <header class="subpage-header">
    <a href="index.html" class="logo">Florlaine<span>.</span></a>
    <a href="index.html" class="back-link">← Back to home</a>
    <div class="spacer"></div>
    <a href="cart.html">🛒 View Cart</a>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle night mode" aria-pressed="false">
      <span class="stitch"></span>
    </button>
  </header>

  <section class="products" id="products">
    <h1 class="heading">Latest <span>Accessories</span></h1>
    <div class="box-container">

      <div class="box">
        <span class="discount">-10%</span>
        <div class="image">
          <img src="imges/hair-bow.svg" alt="Bow Hair Clip">
          <div class="icons">
            <button class="cart-btn" data-name="Bow Hair Clip" data-price="12.99" data-image="imges/hair-bow.svg">Add to Cart</button>
          </div>
        </div>
        <div class="content"><h3>Bow Hair Clip</h3><div class="price">$12.99 <span>$15.99</span></div></div>
      </div>

      <div class="box">
        <span class="discount">-15%</span>
        <div class="image">
          <img src="imges/hair-tie.svg" alt="Knitted Hair Tie">
          <div class="icons">
            <button class="cart-btn" data-name="Knitted Hair Tie" data-price="12.99" data-image="imges/hair-tie.svg">Add to Cart</button>
          </div>
        </div>
        <div class="content"><h3>Knitted Hair Tie</h3><div class="price">$12.99 <span>$15.99</span></div></div>
      </div>

      <div class="box">
        <span class="discount">-15%</span>
        <div class="image">
          <img src="imges/book-rose.svg" alt="Rosey Books bookmark">
          <div class="icons">
            <button class="cart-btn" data-name="Rosey Books" data-price="12.99" data-image="imges/book-rose.svg">Add to Cart</button>
          </div>
        </div>
        <div class="content"><h3>Rosey Books</h3><div class="price">$12.99 <span>$15.99</span></div></div>
      </div>

      <div class="box">
        <span class="discount">-15%</span>
        <div class="image">
          <img src="imges/book-y.svg" alt="Sunny Books bookmark">
          <div class="icons">
            <button class="cart-btn" data-name="Sunny Books" data-price="12.99" data-image="imges/book-y.svg">Add to Cart</button>
          </div>
        </div>
        <div class="content"><h3>Sunny Books</h3><div class="price">$12.99 <span>$15.99</span></div></div>
      </div>

    </div>
  </section>

  <script src="products.js"></script>
</body>
</html>
