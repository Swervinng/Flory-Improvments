<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Colorful | Florlaine</title>
  <link rel="icon" href="imges/head.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="products.css" />
  <link rel="stylesheet" href="theme.css" />
  <script src="theme.js" defer></script>
</head>
<body>

  <header class="subpage-header">
    <a href="index.html" class="logo">Florlaine<span>.</span></a>
    <a href="index.html#products" class="back-link">← All collections</a>
    <div class="spacer"></div>
    <a href="cart.html">🛒 View Cart</a>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle night mode" aria-pressed="false">
      <span class="stitch"></span>
    </button>
  </header>

  <section class="products" id="products">
    <h1 class="heading">Latest <span>Colorful</span></h1>
    <div class="box-container">

      <div class="box">
        <span class="discount">-10%</span>
        <div class="image">
          <img src="imges/coton-candy-bloom.svg" alt="Cotton Candy Bloom knitted bouquet">
          <div class="icons">
            <button class="cart-btn" data-name="Cotton Candy Bloom" data-price="12.99" data-image="imges/coton-candy-bloom.svg">Add to Cart</button>
          </div>
        </div>
        <div class="content"><h3>Cotton Candy Bloom</h3><div class="price">$12.99 <span>$15.99</span></div></div>
      </div>

      <div class="box">
        <span class="discount">-15%</span>
        <div class="image">
          <img src="imges/lemon-blossom.svg" alt="Lemon Blossom knitted bouquet">
          <div class="icons">
            <button class="cart-btn" data-name="Lemon Blossom" data-price="12.99" data-image="imges/lemon-blossom.svg">Add to Cart</button>
          </div>
        </div>
        <div class="content"><h3>Lemon Blossom</h3><div class="price">$12.99 <span>$15.99</span></div></div>
      </div>

      <div class="box">
        <span class="discount">-5%</span>
        <div class="image">
          <img src="imges/indigo-petals.svg" alt="Indigo Petals knitted bouquet">
          <div class="icons">
            <button class="cart-btn" data-name="Indigo Petals" data-price="12.99" data-image="imges/indigo-petals.svg">Add to Cart</button>
          </div>
        </div>
        <div class="content"><h3>Indigo Petals</h3><div class="price">$12.99 <span>$15.99</span></div></div>
      </div>

      <div class="box">
        <span class="discount">-20%</span>
        <div class="image">
          <img src="imges/cherry-blossom.svg" alt="Cherry Blossom knitted bouquet">
          <div class="icons">
            <button class="cart-btn" data-name="Cherry Blossom" data-price="12.99" data-image="imges/cherry-blossom.svg">Add to Cart</button>
          </div>
        </div>
        <div class="content"><h3>Cherry Blossom</h3><div class="price">$12.99 <span>$15.99</span></div></div>
      </div>

    </div>
  </section>

  <script src="products.js"></script>
</body>
</html>
