<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Seasons | Florlaine</title>
  <link rel="icon" href="imges/head.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="products.css" />
  <link rel="stylesheet" href="theme.css" />
  <script src="theme.js" defer></script>
</head>
<body>

  <header class="subpage-header">
    <a href="index.html" class="logo">Florlaine<span>.</span></a>
    <a href="index.html#products" class="back-link">← All collections</a>
    <div class="spacer"></div>
    <a href="cart.html">🛒 View Cart</a>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle night mode" aria-pressed="false">
      <span class="stitch"></span>
    </button>
  </header>

  <section class="products" id="products">
    <h1 class="heading">Latest <span>Seasons</span></h1>
    <div class="box-container">

      <div class="box">
        <span class="discount">-10%</span>
        <div class="image">
          <img src="imges/winter.svg" alt="Winter's Grace knitted bouquet">
          <div class="icons">
            <button class="cart-btn" data-name="Winter's Grace" data-price="12.99" data-image="imges/winter.svg">Add to Cart</button>
          </div>
        </div>
        <div class="content">
          <h3>Winter's Grace</h3>
          <div class="price">$12.99 <span>$15.99</span></div>
        </div>
      </div>

      <div class="box">
        <span class="discount">-15%</span>
        <div class="image">
          <img src="imges/autumn.svg" alt="Autumn Breeze knitted bouquet">
          <div class="icons">
            <button class="cart-btn" data-name="Autumn Breeze" data-price="12.99" data-image="imges/autumn.svg">Add to Cart</button>
          </div>
        </div>
        <div class="content">
          <h3>Autumn Breeze</h3>
          <div class="price">$12.99 <span>$15.99</span></div>
        </div>
      </div>

      <div class="box">
        <span class="discount">-5%</span>
        <div class="image">
          <img src="imges/summer.svg" alt="Summer Whispers knitted bouquet">
          <div class="icons">
            <button class="cart-btn" data-name="Summer Whispers" data-price="12.99" data-image="imges/summer.svg">Add to Cart</button>
          </div>
        </div>
        <div class="content">
          <h3>Summer Whispers</h3>
          <div class="price">$12.99 <span>$15.99</span></div>
        </div>
      </div>

      <div class="box">
        <span class="discount">-20%</span>
        <div class="image">
          <img src="imges/sprii.svg" alt="Spring Essence knitted bouquet">
          <div class="icons">
            <button class="cart-btn" data-name="Spring Essence" data-price="12.99" data-image="imges/sprii.svg">Add to Cart</button>
          </div>
        </div>
        <div class="content">
          <h3>Spring Essence</h3>
          <div class="price">$12.99 <span>$15.99</span></div>
        </div>
      </div>

    </div>
  </section>

  <script src="products.js"></script>
</body>
</html>
